aid: influitive
name: Influitive
description: >-
  Influitive is a Toronto-based SaaS company that provides a customer advocacy, community, and engagement
  platform (historically branded AdvocateHub) that helps B2B companies discover, mobilize, and reward their
  customer advocates. The platform runs gamified challenges, guided customer journeys, referral and reference
  programs, reviews and social amplification, discussions, ideation, and loyalty rewards. Influitive exposes
  a small public HTTP API — the Events endpoint — that lets external systems log an event or act of advocacy
  and award points to an advocate, plus a catalog of outbound webhooks that notify integrations when
  advocacy, challenge, reward, referral, discussion, and profile events occur inside a hub. Developer
  documentation is published on a ReadMe-hosted portal at influitive.readme.io.
